name: Reset Database

# Destructive, manually dispatched reset for the Cho app tables in production
# D1. The app has never served live user data, so the retired recipe schema is
# dropped instead of migrated. Every table this workflow touches is listed
# explicitly below; no other table is modified.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type reset-cho-database to drop the Cho tables and re-apply migrations.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: reset-database
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  reset:
    runs-on: ubuntu-latest
    name: Reset production D1
    timeout-minutes: 15
    steps:
      - name: Verify confirmation input
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "reset-cho-database" ]]; then
            echo "::error::The confirmation input must be exactly 'reset-cho-database'."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "cho"
          env: "production"

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Drop Cho tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ env.CLOUDFLARE_DATABASE_ID || secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_DATABASE_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_DATABASE_ID must all be set."
            exit 1
          fi

          # Child tables first so foreign keys stay satisfied, then
          # d1_migrations so cf re-applies every local migration.
          pnpm --dir app exec cf d1 query "$CLOUDFLARE_DATABASE_ID" --sql "
            DROP TABLE IF EXISTS meal_log_items;
            DROP TABLE IF EXISTS meal_logs;
            DROP TABLE IF EXISTS dish_ingredients;
            DROP TABLE IF EXISTS dishes;
            DROP TABLE IF EXISTS foods;
            DROP TABLE IF EXISTS media_images;
            DROP TABLE IF EXISTS app_settings;
            DROP TABLE IF EXISTS ingredients;
            DROP TABLE IF EXISTS mcp_tool_usage_daily;
            DROP TABLE IF EXISTS mcp_api_tokens;
            DROP TABLE IF EXISTS d1_migrations;
          "

      - name: Apply migrations
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ env.CLOUDFLARE_DATABASE_ID || secrets.CLOUDFLARE_DATABASE_ID }}
          # Never wait for a TTY confirmation in CI.
          CI: "true"
        run: |
          set -euo pipefail
          vp exec cf d1 migrations apply "$CLOUDFLARE_DATABASE_ID" --dir migrations

      - name: Print final table list
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ env.CLOUDFLARE_DATABASE_ID || secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          set -euo pipefail
          pnpm --dir app exec cf d1 query "$CLOUDFLARE_DATABASE_ID" -q \
            --sql "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name;"
