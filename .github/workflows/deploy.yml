name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Restore Vite Task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  deploy:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App
    steps:
      - uses: actions/checkout@v5

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "cho"
          env: "production"

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Restore Vite Task cache
        id: task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      # app と storybook をビルドする。
      - name: Build app
        run: pnpm run build

      - name: Save Vite Task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

      - name: Smoke test built Worker locally
        run: pnpm run smoke:worker

      - name: Warn when settings encryption is not configured
        env:
          SETTINGS_ENCRYPTION_KEY: ${{ env.SETTINGS_ENCRYPTION_KEY || secrets.SETTINGS_ENCRYPTION_KEY }}
        run: |
          if [[ -z "$SETTINGS_ENCRYPTION_KEY" ]]; then
            echo "::warning::SETTINGS_ENCRYPTION_KEY is not configured; integration settings, AI integration, and signed image URLs will be unavailable."
          fi

      - name: Apply D1 migrations
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ env.CLOUDFLARE_DATABASE_ID || secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?}" "${CLOUDFLARE_ACCOUNT_ID:?}" "${CLOUDFLARE_DATABASE_ID:?}"
          CI=true vp exec cf d1 migrations apply "$CLOUDFLARE_DATABASE_ID" --dir migrations

      - name: Deploy
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ env.CLOUDFLARE_DATABASE_ID || secrets.CLOUDFLARE_DATABASE_ID }}
          SETTINGS_ENCRYPTION_KEY: ${{ env.SETTINGS_ENCRYPTION_KEY || secrets.SETTINGS_ENCRYPTION_KEY }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ env.CLOUDFLARE_ACCESS_CLIENT_ID || secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ env.CLOUDFLARE_ACCESS_CLIENT_SECRET || secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        # `INVENTIA_STOCK_WRITES_ENABLED` and `MCP_MANAGEMENT_ENABLED` are enabled
        # only when `--mode production` is passed to `cf deploy`.
        run: |
          set -euo pipefail
          secrets_args=()
          if [[ -n "${SETTINGS_ENCRYPTION_KEY:-}${CLOUDFLARE_ACCESS_CLIENT_ID:-}${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]]; then
            secrets_file="$RUNNER_TEMP/worker-secrets.json"
            trap 'rm -f "$secrets_file"' EXIT
            jq -n \
              --arg settings "${SETTINGS_ENCRYPTION_KEY:-}" \
              --arg accessId "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" \
              --arg accessSecret "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" \
              '{SETTINGS_ENCRYPTION_KEY: $settings, CLOUDFLARE_ACCESS_CLIENT_ID: $accessId, CLOUDFLARE_ACCESS_CLIENT_SECRET: $accessSecret}
               | with_entries(select(.value != ""))' > "$secrets_file"
            secrets_args=(--secrets-file "$secrets_file")
          fi
          vp exec cf deploy --prebuilt --mode production "${secrets_args[@]}" \
            --message "Deployed by GitHub Actions ${GITHUB_SHA::7}"
