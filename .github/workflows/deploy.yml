name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App
    steps:
      - uses: actions/checkout@v5

      - name: Resolve D1 database id
        env:
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_DATABASE_ID" =~ ^[[:alnum:]-]+$ ]]; then
            echo "CLOUDFLARE_DATABASE_ID is missing or invalid."
            exit 1
          fi
          sed -i "s/<D1_DATABASE_ID>/${CLOUDFLARE_DATABASE_ID}/" app/wrangler.jsonc

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      # app だけをビルドしてデプロイする。
      - name: Build app
        run: pnpm run build
      - name: Smoke test built Worker locally
        run: pnpm run smoke:worker

      - name: Warn when settings encryption is not configured
        env:
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
        run: |
          if [[ -z "$SETTINGS_ENCRYPTION_KEY" ]]; then
            echo "::warning::SETTINGS_ENCRYPTION_KEY is not configured; integration settings, AI integration, and signed image URLs will be unavailable."
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
          workingDirectory: app

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        env:
          SETTINGS_ENCRYPTION_KEY: ${{ secrets.SETTINGS_ENCRYPTION_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `INVENTIA_STOCK_WRITES_ENABLED` is deliberately absent from
          # app/wrangler.jsonc so a preview can never inherit production stock
          # writes. Only this production step enables it; every other build
          # (including PR previews, which force "false") stays default-deny.
          command: "deploy --var INVENTIA_STOCK_WRITES_ENABLED:true"
          secrets: ${{ secrets.SETTINGS_ENCRYPTION_KEY != '' && 'SETTINGS_ENCRYPTION_KEY' || '' }}
          workingDirectory: app
