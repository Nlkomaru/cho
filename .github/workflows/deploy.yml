name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App
    steps:
      - uses: actions/checkout@v5

      - name: Load Production Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "cho"
          env: "production"

      - name: Resolve D1 database id
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_DATABASE_ID:-}" =~ ^[[:alnum:]-]+$ ]]; then
            echo "CLOUDFLARE_DATABASE_ID is missing or invalid."
            exit 1
          fi
          sed -i "s/<D1_DATABASE_ID>/${CLOUDFLARE_DATABASE_ID}/" app/wrangler.jsonc

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      # app だけをビルドしてデプロイする。
      - name: Build app
        run: pnpm run build
      - name: Smoke test built Worker locally
        run: pnpm run smoke:worker

      - name: Warn when settings encryption is not configured
        run: |
          if [[ -z "${SETTINGS_ENCRYPTION_KEY:-}" ]]; then
            echo "::warning::SETTINGS_ENCRYPTION_KEY is not configured; integration settings, AI integration, and signed image URLs will be unavailable."
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote
          workingDirectory: app

      - name: Deploy
        working-directory: app
        # `INVENTIA_STOCK_WRITES_ENABLED` is deliberately absent from
        # app/wrangler.jsonc so a preview can never inherit production stock
        # writes. Only this production step enables it; every other build
        # (including PR previews, which force "false") stays default-deny.
        run: pnpm exec wrangler deploy --var INVENTIA_STOCK_WRITES_ENABLED:true --var MCP_MANAGEMENT_ENABLED:true

      - name: Upload settings encryption secret
        working-directory: app
        run: |
          if [[ -n "${SETTINGS_ENCRYPTION_KEY:-}" ]]; then
            printf '%s' "$SETTINGS_ENCRYPTION_KEY" | pnpm exec wrangler secret put SETTINGS_ENCRYPTION_KEY
          fi
