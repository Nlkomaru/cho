name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: auto
  AWS_EC2_METADATA_DISABLED: true
  PREVIEW_BASE_URL: https://ci.nikomaru.dev/cho
  AWS_REGION: auto
  WORKER_NAME: cho
  WORKER_SUBDOMAIN: nikomaru.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Smoke test built Worker locally
        run: pnpm run smoke:worker

  deploy-app-preview:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App Preview
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Resolve D1 database id
        env:
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_DATABASE_ID" =~ ^[[:alnum:]-]+$ ]]; then
            echo "CLOUDFLARE_DATABASE_ID is missing or invalid."
            exit 1
          fi
          sed -i "s/<D1_DATABASE_ID>/${CLOUDFLARE_DATABASE_ID}/" app/wrangler.jsonc

      - name: Install
        run: pnpm install

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm run build

      - name: Restrict preview Worker bindings
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const configPath = "app/dist/server/wrangler.json";
          const config = JSON.parse(await readFile(configPath, "utf8"));
          delete config.r2_buckets;
          if (config.vars) {
            delete config.vars.INVENTIA_BASE_URL;
            if (Object.keys(config.vars).length === 0) delete config.vars;
          }
          config.workers_dev = true;
          config.preview_urls = true;
          await writeFile(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Set preview alias SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Upload stable preview alias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias preview --message "PR #${{ github.event.number }} preview alias"
          workingDirectory: app/dist/server

      - name: Upload pull request preview alias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr${{ github.event.number }} --message "PR #${{ github.event.number }} preview alias"
          workingDirectory: app/dist/server

      - name: Upload commit preview alias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias ${{ steps.vars.outputs.commit_sha }} --message "PR #${{ github.event.number }} commit preview alias"
          workingDirectory: app/dist/server

      - name: Verify preview aliases and Storybook
        env:
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          urls=(
            "https://preview-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
            "https://pr${PR_NUMBER}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
            "https://${COMMIT_SHORT_SHA}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
          )
          for url in "${urls[@]}"; do
            for path in / /storybook/; do
              target="${url}${path}"
              curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$target" --output /dev/null
              echo "Verified $target"
            done
          done

  comment:
    needs: [check, deploy-app-preview]
    if: always()
    runs-on: ubuntu-latest
    name: Comment Preview URLs
    timeout-minutes: 10
    steps:
      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:8}" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.33.3
          run_install: false

      - name: Render and upload QR codes
        id: qr
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          S3_URL: ${{ secrets.R2_S3_ENDPOINT }}
          APP_PREVIEW_AVAILABLE: ${{ needs.deploy-app-preview.result == 'success' }}
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          upload_qr() {
            name="$1"
            url="$2"
            [ -n "$url" ] || return 0

            if ! pnpm dlx qrcode@1.5.4 -t png -s 6 -q 2 -o "$name.png" -- "$url"; then
              echo "::warning::failed to render the $name QR code"
              return 0
            fi
            if ! aws s3 cp "$name.png" \
              "s3://${BUCKET_NAME}/cho/${COMMIT_SHORT_SHA}/qr/$name.png" \
              --endpoint-url "$S3_URL" \
              --content-type image/png \
              --only-show-errors; then
              echo "::warning::failed to upload the $name QR code"
              return 0
            fi

            echo "${name//-/_}_qr_url=${PREVIEW_BASE_URL}/${COMMIT_SHORT_SHA}/qr/$name.png" >> "$GITHUB_OUTPUT"
          }

          if [ "$APP_PREVIEW_AVAILABLE" = "true" ]; then
            preview_url="https://preview-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
            pr_url="https://pr${PR_NUMBER}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
            sha_url="https://${COMMIT_SHORT_SHA}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
            upload_qr app-preview "$preview_url"
            upload_qr storybook-preview "${preview_url}/storybook/"
            upload_qr app-pr "$pr_url"
            upload_qr storybook-pr "${pr_url}/storybook/"
            upload_qr app-commit "$sha_url"
            upload_qr storybook-commit "${sha_url}/storybook/"
          fi

      - name: Create preview comment
        env:
          APP_PREVIEW_AVAILABLE: ${{ needs.deploy-app-preview.result == 'success' }}
          APP_PREVIEW_QR_URL: ${{ steps.qr.outputs.app_preview_qr_url }}
          STORYBOOK_PREVIEW_QR_URL: ${{ steps.qr.outputs.storybook_preview_qr_url }}
          APP_PR_QR_URL: ${{ steps.qr.outputs.app_pr_qr_url }}
          STORYBOOK_PR_QR_URL: ${{ steps.qr.outputs.storybook_pr_qr_url }}
          APP_COMMIT_QR_URL: ${{ steps.qr.outputs.app_commit_qr_url }}
          STORYBOOK_COMMIT_QR_URL: ${{ steps.qr.outputs.storybook_commit_qr_url }}
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          preview_url=""
          pr_url=""
          sha_url=""
          if [ "$APP_PREVIEW_AVAILABLE" = "true" ]; then
            preview_url="https://preview-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
            pr_url="https://pr${PR_NUMBER}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
            sha_url="https://${COMMIT_SHORT_SHA}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
          fi

          row() {
            label="$1"
            url="$2"
            qr="$3"
            if [ -z "$url" ]; then
              printf '| %s | Not available | — |\n' "$label" >> comment.md
              return
            fi
            if [ -n "$qr" ]; then
              printf '| %s | <%s> | <img src="%s" width="120" height="120" alt="%s preview QR code"> |\n' \
                "$label" "$url" "$qr" "$label" >> comment.md
            else
              printf '| %s | <%s> | — |\n' "$label" "$url" >> comment.md
            fi
          }

          cat << 'EOF' > comment.md
          ## Deploy preview

          | Target | URL | QR |
          | --- | --- | --- |
          EOF
          row "App preview" "$preview_url" "$APP_PREVIEW_QR_URL"
          row "Storybook preview" "${preview_url:+$preview_url/storybook/}" "$STORYBOOK_PREVIEW_QR_URL"
          row "PR #${PR_NUMBER} App" "$pr_url" "$APP_PR_QR_URL"
          row "PR #${PR_NUMBER} Storybook" "${pr_url:+$pr_url/storybook/}" "$STORYBOOK_PR_QR_URL"
          row "Commit ${COMMIT_SHORT_SHA} App" "$sha_url" "$APP_COMMIT_QR_URL"
          row "Commit ${COMMIT_SHORT_SHA} Storybook" "${sha_url:+$sha_url/storybook/}" "$STORYBOOK_COMMIT_QR_URL"
          if [ "$APP_PREVIEW_AVAILABLE" != "true" ]; then
            echo "Preview URLs unavailable because App Worker deployment failed; see the Deploy App Preview job."
          else
            echo "All aliases serve the same preview build. App API writes to production D1 without authentication; production R2 and Inventia integrations are omitted. Use only if authorized."
          fi >> comment.md

      - name: Create PR comment
        run: |
          for attempt in 1 2 3; do
            if gh pr comment "${{ github.event.number }}" \
              --body-file comment.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to post the preview comment after 3 attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
