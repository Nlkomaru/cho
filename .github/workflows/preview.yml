name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: auto
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: auto
  PREVIEW_BASE_URL: https://ci.nikomaru.dev/cho
  WORKER_NAME: cho

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Smoke test built Worker locally
        run: pnpm run smoke:worker

  deploy-app-preview:
    if: ${{ false }} # App preview would expose the production D1 binding on a public workers.dev URL.
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App Preview (disabled)
    steps:
      - run: echo "App preview disabled until its data bindings are isolated."

  deploy-storybook-preview:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy Storybook Preview
    steps:
      - uses: actions/checkout@v5

      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Build Storybook
        run: pnpm --filter ./storybook run build

      - name: Upload Storybook to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          S3_URL: ${{ secrets.R2_S3_ENDPOINT }}
        run: |
          aws configure set default.s3.max_concurrent_requests 50
          s3_base="s3://${BUCKET_NAME}/cho/${COMMIT_SHORT_SHA}"
          s3_options="--endpoint-url ${S3_URL} --only-show-errors --recursive"
          aws s3 cp ./storybook/storybook-static "$s3_base/storybook" $s3_options
          aws s3api put-object \
            --bucket "$BUCKET_NAME" \
            --key "cho/${COMMIT_SHORT_SHA}/storybook/" \
            --body ./storybook/storybook-static/index.html \
            --content-type text/html \
            --endpoint-url "$S3_URL" > /dev/null

  comment:
    needs: [check, deploy-app-preview, deploy-storybook-preview]
    if: always()
    runs-on: ubuntu-latest
    name: Comment Preview URLs
    timeout-minutes: 10
    steps:
      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.33.3
          run_install: false

      - name: Render and upload QR codes
        id: qr
        timeout-minutes: 5
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          S3_URL: ${{ secrets.R2_S3_ENDPOINT }}
          APP_VERSION_ID: ${{ needs.deploy-app-preview.outputs.version_id }}
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
        run: |
          app_preview_url=""
          storybook_preview_url="${PREVIEW_BASE_URL}/${COMMIT_SHORT_SHA}/storybook/"

          upload_qr() {
            name="$1"
            url="$2"
            [ -n "$url" ] || return 0

            if ! pnpm dlx qrcode@1.5.4 -t png -s 6 -q 2 -o "$name.png" -- "$url"; then
              echo "::warning::failed to render the $name QR code"
              return 0
            fi
            if ! aws s3 cp "$name.png" \
              "s3://${BUCKET_NAME}/cho/${COMMIT_SHORT_SHA}/qr/$name.png" \
              --endpoint-url "$S3_URL" \
              --content-type image/png \
              --only-show-errors; then
              echo "::warning::failed to upload the $name QR code"
              return 0
            fi

            echo "${name}_qr_url=${PREVIEW_BASE_URL}/${COMMIT_SHORT_SHA}/qr/$name.png" >> "$GITHUB_OUTPUT"
          }

          if [ -n "$APP_VERSION_ID" ]; then
            app_preview_url="https://${APP_VERSION_ID}-${WORKER_NAME}.nikomaru.workers.dev"
            upload_qr app "$app_preview_url"
          fi
          upload_qr storybook "$storybook_preview_url"

      - name: Create preview comment
        env:
          APP_VERSION_ID: ${{ needs.deploy-app-preview.outputs.version_id }}
          APP_QR_URL: ${{ steps.qr.outputs.app_qr_url }}
          STORYBOOK_QR_URL: ${{ steps.qr.outputs.storybook_qr_url }}
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
        run: |
          app_preview_url=""
          storybook_preview_url="${PREVIEW_BASE_URL}/${COMMIT_SHORT_SHA}/storybook/"
          if [ -n "$APP_VERSION_ID" ]; then
            app_preview_url="https://${APP_VERSION_ID}-${WORKER_NAME}.nikomaru.workers.dev"
          fi

          row() {
            label="$1"
            url="$2"
            qr="$3"
            if [ -z "$url" ]; then
              printf '| %s | Not available | — |\n' "$label" >> comment.md
              return
            fi
            if [ -n "$qr" ]; then
              printf '| %s | <%s> | <img src="%s" width="120" height="120" alt="%s preview QR code"> |\n' \
                "$label" "$url" "$qr" "$label" >> comment.md
            else
              printf '| %s | <%s> | — |\n' "$label" "$url" >> comment.md
            fi
          }

          cat << 'EOF' > comment.md
          ## Deploy preview

          | Target | URL | QR |
          | --- | --- | --- |
          EOF
          row App "$app_preview_url" "$APP_QR_URL"
          row Storybook "$storybook_preview_url" "$STORYBOOK_QR_URL"
          cat << 'EOF' >> comment.md

          App preview is disabled until a safe isolated D1/Access setup exists; Storybook preview is available.
          EOF

      - name: Create PR comment
        run: |
          for attempt in 1 2 3; do
            if gh pr comment "${{ github.event.number }}" \
              --body-file comment.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to post the preview comment after 3 attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
