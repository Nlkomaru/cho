name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_EC2_METADATA_DISABLED: true
  S3_URL: ${{ secrets.S3_URL }}
  BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
  PREVIEW_BASE_URL: https://ci.nikomaru.dev/cho

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

  deploy-preview:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy Preview
    outputs:
      app_url: ${{ steps.resolve-preview-url.outputs.app_url }}
      storybook_url: ${{ steps.resolve-preview-url.outputs.storybook_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            2bad9e23-82af-4fba-b514-b49900e1632f > CLOUDFLARE_ACCOUNT_ID
            f1bf4fa4-0288-4a31-b28b-b499013acdce > CLOUDFLARE_API_KEY

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      # 本番と同じく、Storybook を app の /storybook に同梱する。
      - name: Build app and Storybook
        run: pnpm run build

      - name: Upload preview version
        id: deploy-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_KEY }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --message "Deployed preview by GitHub Actions branch ${{ github.ref_name }}"
          workingDirectory: app

      - name: Resolve preview URLs
        id: resolve-preview-url
        env:
          WRANGLER_DEPLOYMENT_URL: ${{ steps.deploy-preview.outputs.deployment-url }}
          WRANGLER_COMMAND_OUTPUT: ${{ steps.deploy-preview.outputs.command-output }}
          WRANGLER_COMMAND_STDERR: ${{ steps.deploy-preview.outputs.command-stderr }}
        shell: bash
        run: |
          url="$WRANGLER_DEPLOYMENT_URL"
          if [ -z "$url" ]; then
            output="$WRANGLER_COMMAND_OUTPUT"$'\n'"$WRANGLER_COMMAND_STDERR"
            url=$(echo "$output" | grep -Eo 'https://[^[:space:]]+' | head -n 1 || true)
          fi

          if [ -z "$url" ]; then
            echo "Failed to resolve preview URL from wrangler-action outputs."
            exit 1
          fi

          app_url="${url%/}"
          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"
          echo "storybook_url=$app_url/storybook/" >> "$GITHUB_OUTPUT"

  comment:
    needs: [check, deploy-preview]
    if: always()
    runs-on: ubuntu-latest
    name: Comment Preview URLs
    timeout-minutes: 10
    steps:
      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            7fca16ab-3904-4706-9849-b49900de563a > AWS_ACCESS_KEY_ID
            769a462b-bf2d-466c-ae1f-b49900de56c8 > AWS_SECRET_ACCESS_KEY

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10.33.3
          run_install: false

      - name: Render and upload QR codes
        id: qr
        timeout-minutes: 5
        env:
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          APP_PREVIEW_URL: ${{ needs.deploy-preview.outputs.app_url }}
          STORYBOOK_PREVIEW_URL: ${{ needs.deploy-preview.outputs.storybook_url }}
        run: |
          upload_qr() {
            name="$1"
            url="$2"
            [ -n "$url" ] || return 0

            if ! pnpm dlx qrcode@1.5.4 -t png -s 6 -q 2 -o "$name.png" -- "$url"; then
              echo "::warning::failed to render the $name QR code"
              return 0
            fi
            if [ ! -s "$name.png" ]; then
              echo "::warning::the rendered $name QR code is empty"
              return 0
            fi

            if ! aws s3 cp "$name.png" \
              "s3://${BUCKET_NAME}/cho/${COMMIT_SHORT_SHA}/qr/$name.png" \
              --endpoint-url "${S3_URL}" \
              --content-type image/png \
              --only-show-errors; then
              echo "::warning::failed to upload the $name QR code"
              return 0
            fi

            echo "${name}_qr_url=${PREVIEW_BASE_URL}/${COMMIT_SHORT_SHA}/qr/$name.png" >> "$GITHUB_OUTPUT"
          }

          upload_qr app "$APP_PREVIEW_URL"
          upload_qr storybook "$STORYBOOK_PREVIEW_URL"

      - name: Create comment file
        env:
          APP_PREVIEW_URL: ${{ needs.deploy-preview.outputs.app_url }}
          STORYBOOK_PREVIEW_URL: ${{ needs.deploy-preview.outputs.storybook_url }}
          APP_QR_URL: ${{ steps.qr.outputs.app_qr_url }}
          STORYBOOK_QR_URL: ${{ steps.qr.outputs.storybook_qr_url }}
        run: |
          row() {
            label="$1"
            url="$2"
            qr="$3"
            if [ -z "$url" ]; then
              printf '| %s | Not available | — |\n' "$label" >> comment.md
              return
            fi
            if [ -n "$qr" ]; then
              printf '| %s | <%s> | <img src="%s" width="120" height="120" alt="%s preview QR code"> |\n' \
                "$label" "$url" "$qr" "$label" >> comment.md
            else
              printf '| %s | <%s> | — |\n' "$label" "$url" >> comment.md
            fi
          }

          cat << 'EOF' > comment.md
          ## Deploy preview

          | Target | URL | QR |
          | --- | --- | --- |
          EOF

          row App "$APP_PREVIEW_URL" "$APP_QR_URL"
          row Storybook "$STORYBOOK_PREVIEW_URL" "$STORYBOOK_QR_URL"

          cat << 'EOF' >> comment.md

          スマートフォンから開く場合は QR を読み取ってください。App プレビューは Cloudflare Access のサインインを求められる場合があります。
          EOF

      - name: Create PR comment
        run: |
          for attempt in 1 2 3; do
            if gh pr comment "${{ github.event.number }}" \
              --body-file comment.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to post the preview comment after 3 attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
