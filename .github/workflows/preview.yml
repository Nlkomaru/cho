name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORKER_NAME: cho
  WORKER_SUBDOMAIN: nikomaru.workers.dev

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Smoke test built Worker locally
        run: pnpm run smoke:worker

  deploy-app-preview:
    needs: check
    runs-on: ubuntu-latest
    name: Deploy App Preview
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Load Preview Secrets
        uses: nlkomaru/secret-manager@main
        with:
          project: "cho"
          env: "preview"

      - name: Resolve D1 database id
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_DATABASE_ID:-}" =~ ^[[:alnum:]-]+$ ]]; then
            echo "CLOUDFLARE_DATABASE_ID is missing or invalid."
            exit 1
          fi
          sed -i "s/<D1_DATABASE_ID>/${CLOUDFLARE_DATABASE_ID}/" app/wrangler.jsonc

      - name: Install
        run: pnpm install

      # Preview shares production D1; schema changes require operator-approved deployment.
      - name: Check production D1 schema (read-only)
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi

          query() {
            pnpm --dir app exec wrangler d1 execute DB --remote --json \
              --config wrangler.jsonc --command "$1"
          }

          migrate_hint() {
            echo "::error::Do not apply migrations blindly: existing tables may conflict with 0000_initial.sql. Review the read-only metadata, prepare a data-preserving schema-version migration, and obtain explicit operator approval before any production writes."
          }

          tables_json="$(mktemp)"
          if ! query "SELECT name FROM sqlite_master WHERE type = 'table';" >"$tables_json"; then
            echo "::error::Read-only D1 schema query failed; refusing to upload a preview against an unverified database."
            # With --json, wrangler prints API errors to stdout; surface them.
            jq -c '.error? // .errors? // .' "$tables_json" 2>/dev/null || cat "$tables_json"
            exit 1
          fi

          tables="$(jq -r '.[].results[]?.name' "$tables_json")"
          missing_tables=()
          for table in ingredients media_images dishes dish_ingredients meal_logs meal_log_items app_settings mcp_api_tokens mcp_tool_usage_daily; do
            if ! grep -qxF "$table" <<<"$tables"; then
              missing_tables+=("$table")
            fi
          done
          if (( ${#missing_tables[@]} > 0 )); then
            echo "::error::Production D1 database is missing required table(s): ${missing_tables[*]}."
            echo "Existing table/index schema (metadata only; no application rows):"
            query "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE type IN ('table', 'index') ORDER BY type, name;"
            echo "Existing ingredients columns (metadata only):"
            query "PRAGMA table_info(ingredients);"
            migrate_hint
            exit 1
          fi

          columns_json="$(mktemp)"
          if ! query "PRAGMA table_info(app_settings);" >"$columns_json"; then
            echo "::error::Read-only D1 column query failed for app_settings."
            jq -c '.error? // .errors? // .' "$columns_json" 2>/dev/null || cat "$columns_json"
            exit 1
          fi

          column_names="$(jq -r '.[].results[]?.name' "$columns_json")"
          column_metadata="$(jq -r '[.[].results[]? | "\(.name):\(.type)"] | join(", ")' "$columns_json")"
          missing_columns=()
          for column in key encrypted_payload public_config_json updated_at; do
            if ! grep -qxF "$column" <<<"$column_names"; then
              missing_columns+=("$column")
            fi
          done
          if (( ${#missing_columns[@]} > 0 )); then
            echo "::error::app_settings is missing required column(s): ${missing_columns[*]}."
            migrate_hint
            exit 1
          fi
          tokens_columns="$(mktemp)"
          usage_columns="$(mktemp)"
          tokens_sql="$(mktemp)"
          usage_sql="$(mktemp)"
          usage_foreign_keys="$(mktemp)"
          indexes="$(mktemp)"
          token_owner_index="$(mktemp)"
          usage_date_index="$(mktemp)"
          for check in \
            "PRAGMA table_info(mcp_api_tokens)|$tokens_columns" \
            "PRAGMA table_info(mcp_tool_usage_daily)|$usage_columns" \
            "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'mcp_api_tokens';|$tokens_sql" \
            "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'mcp_tool_usage_daily';|$usage_sql" \
            "PRAGMA foreign_key_list(mcp_tool_usage_daily)|$usage_foreign_keys" \
            "SELECT name FROM sqlite_master WHERE type = 'index' AND name IN ('mcp_api_tokens_owner_idx', 'mcp_tool_usage_date_idx');|$indexes" \
            "PRAGMA index_info(mcp_api_tokens_owner_idx);|$token_owner_index" \
            "PRAGMA index_info(mcp_tool_usage_date_idx);|$usage_date_index"; do
            command="${check%%|*}"
            output="${check#*|}"
            if ! query "$command" >"$output"; then
              echo "::error::Read-only MCP D1 schema query failed for ${command}."
              jq -c '.error? // .errors? // .' "$output" 2>/dev/null || cat "$output"
              exit 1
            fi
          done

          require_column() {
            local metadata="$1" name="$2" type="$3" not_null="$4" primary_key="$5"
            jq -e --arg name "$name" --arg type "$type" --argjson notNull "$not_null" --argjson primaryKey "$primary_key" \
              '([.[].results[]? | select(.name == $name)][0] // {}) |
               (.name == $name and (.type | ascii_downcase) == $type and .notnull == $notNull and .pk == $primaryKey)' \
              "$metadata" >/dev/null
          }
          schema_error=0
          for column in id name owner_subject prefix secret_hash allowed_tools created_at; do
            primary_key=0
            [[ "$column" == id ]] && primary_key=1
            if ! require_column "$tokens_columns" "$column" text 1 "$primary_key"; then
              echo "::error::mcp_api_tokens.$column is missing or has the wrong type or constraints."
              schema_error=1
            fi
          done
          for column in expires_at revoked_at last_used_at; do
            if ! require_column "$tokens_columns" "$column" text 0 0; then
              echo "::error::mcp_api_tokens.$column is missing or has the wrong type or nullability."
              schema_error=1
            fi
          done
          for field in token_id:1 tool_name:2 utc_date:3; do
            column="${field%%:*}"
            primary_key="${field##*:}"
            if ! require_column "$usage_columns" "$column" text 1 "$primary_key"; then
              echo "::error::mcp_tool_usage_daily.$column is missing or has the wrong type or constraints."
              schema_error=1
            fi
          done
          if ! require_column "$usage_columns" call_count integer 1 0; then
            echo "::error::mcp_tool_usage_daily.call_count is missing or has the wrong type or constraints."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]? | select(.name == "created_at")][0].dflt_value | ascii_downcase == "current_timestamp"' "$tokens_columns" >/dev/null; then
            echo "::error::mcp_api_tokens.created_at is missing its migration default."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]? | select(.name == "call_count")][0].dflt_value == "0"' "$usage_columns" >/dev/null; then
            echo "::error::mcp_tool_usage_daily.call_count is missing its migration default."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]? | select(.pk > 0) | [.pk, .name]] | sort_by(.[0]) | map(.[1]) == ["token_id", "tool_name", "utc_date"]' "$usage_columns" >/dev/null; then
            echo "::error::mcp_tool_usage_daily is missing its composite primary key."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]? | select(.table == "mcp_api_tokens" and .from == "token_id" and .to == "id" and .on_delete == "CASCADE")] | length == 1' "$usage_foreign_keys" >/dev/null; then
            echo "::error::mcp_tool_usage_daily.token_id is missing its cascading token foreign key."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]?.sql | select(type == "string") | gsub("[`\\n]"; " ") | test("secret_hash\\s+text\\s+not\\s+null\\s+unique"; "i")] | length == 1' "$tokens_sql" >/dev/null; then
            echo "::error::mcp_api_tokens.secret_hash is missing its unique constraint."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]?.sql | select(type == "string") | gsub("[`\\n]"; " ") | test("call_count\\s+integer\\s+not\\s+null\\s+default\\s+0\\s+check\\s*\\(\\s*call_count\\s*>=\\s*0\\s*\\)"; "i")] | length == 1' "$usage_sql" >/dev/null; then
            echo "::error::mcp_tool_usage_daily.call_count is missing its non-negative check constraint."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]?.name] | sort == ["mcp_api_tokens_owner_idx", "mcp_tool_usage_date_idx"]' "$indexes" >/dev/null; then
            echo "::error::MCP management indexes are missing from Production D1."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]?.name] == ["owner_subject", "created_at"]' "$token_owner_index" >/dev/null; then
            echo "::error::mcp_api_tokens_owner_idx does not match its migration columns."
            schema_error=1
          fi
          if ! jq -e '[.[].results[]?.name] == ["utc_date"]' "$usage_date_index" >/dev/null; then
            echo "::error::mcp_tool_usage_date_idx does not match its migration columns."
            schema_error=1
          fi
          if (( schema_error != 0 )); then
            migrate_hint
            exit 1
          fi


          echo "Production D1 schema OK: 9 required tables present, including MCP token and usage schemas."
          echo "app_settings columns: ${column_metadata}"

      - name: Set deployment metadata
        run: echo "VITE_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Build app
        run: pnpm run build

      - name: Restrict preview Worker bindings
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const configPath = "app/dist/server/wrangler.json";
          const config = JSON.parse(await readFile(configPath, "utf8"));
          // Keep production R2 out of previews, but keep INVENTIA_BASE_URL so
          // read-only Inventia lookups still work. Stock mutations stay off.
          delete config.r2_buckets;
          config.vars = {
            ...(config.vars ?? {}),
            INVENTIA_STOCK_WRITES_ENABLED: "false",
            MCP_MANAGEMENT_ENABLED: "false",
          };
          config.workers_dev = true;
          config.preview_urls = true;
          await writeFile(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Set preview alias SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare API access to the Worker
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set."
            exit 1
          fi

          # `wrangler versions upload` starts with this exact request; failing here
          # keeps the diagnostic readable instead of an opaque wrangler error.
          url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${WORKER_NAME}"
          status=""
          body="$(mktemp)"
          for attempt in 1 2 3 4 5; do
            status="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$url" || true)"
            if [ "$status" = "200" ]; then
              echo "Cloudflare API can read Worker ${WORKER_NAME}."
              exit 0
            fi
            echo "::warning::GET /accounts/{account_id}/workers/services/${WORKER_NAME} returned HTTP ${status:-no response} (attempt ${attempt})."
            sleep $((attempt * 10))
          done

          echo "Last Cloudflare API response:"
          jq -c '.errors // .' "$body" || cat "$body"
          echo "::error::Cloudflare API rejected the Worker lookup with HTTP ${status}. The token needs the 'Workers Scripts:Edit' permission for this account (dash.cloudflare.com/profile/api-tokens), and CLOUDFLARE_ACCOUNT_ID must be the account that owns ${WORKER_NAME}."
          exit 1

      - name: Upload preview aliases
        env:
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail

          # Forward optional secrets as a version-scoped secrets file. wrangler
          # applies them additively and never deletes inherited secrets, so a
          # missing value leaves existing ciphertext/credentials untouched.
          # Values are never printed.
          secrets_file=""
          if [[ -n "${SETTINGS_ENCRYPTION_KEY:-}${CLOUDFLARE_ACCESS_CLIENT_ID:-}${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]]; then
            secrets_file="$(mktemp)"
            chmod 600 "$secrets_file"
            jq -n \
              --arg settings "${SETTINGS_ENCRYPTION_KEY:-}" \
              --arg accessId "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" \
              --arg accessSecret "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" \
              '{SETTINGS_ENCRYPTION_KEY: $settings, CLOUDFLARE_ACCESS_CLIENT_ID: $accessId, CLOUDFLARE_ACCESS_CLIENT_SECRET: $accessSecret}
               | with_entries(select(.value != ""))' >"$secrets_file"
            echo "Adding repository secrets to the preview version: $(jq -r 'keys | join(", ")' "$secrets_file")."
            trap 'rm -f "$secrets_file"' EXIT
          else
            echo "No settings/Inventia Access secrets configured; preview versions inherit existing Worker secrets."
          fi

          upload() {
            local alias="$1" message="$2" attempt log rc
            local -a args=(--config dist/server/wrangler.json --preview-alias "$alias" --message "$message")
            if [[ -n "$secrets_file" ]]; then
              args+=(--secrets-file "$secrets_file")
            fi
            for attempt in 1 2 3 4; do
              log="$(mktemp)"
              set +e
              pnpm --dir app exec wrangler versions upload "${args[@]}" >"$log" 2>&1
              rc=$?
              set -e
              cat "$log"
              if [ "$rc" -eq 0 ]; then
                rm -f "$log"
                echo "Uploaded preview alias ${alias}."
                return 0
              fi
              # Cloudflare intermittently answers 403 "No access to the specified
              # service." for this lookup even with a valid token; retry those.
              if grep -qiE 'No access to the specified service|A request to the Cloudflare API|Internal Server Error|HTTP 5[0-9][0-9]' "$log"; then
                echo "::warning::Cloudflare API refused the upload for alias ${alias} (attempt ${attempt}); retrying."
                rm -f "$log"
                sleep $((attempt * 15))
                continue
              fi
              rm -f "$log"
              echo "::error::wrangler versions upload failed for alias ${alias}."
              return 1
            done
            echo "::error::wrangler versions upload failed for alias ${alias} after 4 attempts."
            return 1
          }

          upload "pr${PR_NUMBER}" "PR #${PR_NUMBER} preview alias"
          upload "$COMMIT_SHORT_SHA" "PR #${PR_NUMBER} commit preview alias"

      - name: Verify preview aliases
        env:
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          urls=(
            "https://pr${PR_NUMBER}-${WORKER_NAME}.${WORKER_SUBDOMAIN}/"
            "https://${COMMIT_SHORT_SHA}-${WORKER_NAME}.${WORKER_SUBDOMAIN}/"
          )
          for target in "${urls[@]}"; do
            status=""
            for attempt in 1 2 3 4 5; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$target" || true)"
              # 2xx serves the Worker; 302 means Cloudflare Access guards the
              # hostname. Anything else means the alias is not serving yet.
              if [[ "$status" =~ ^[23] ]]; then break; fi
              sleep $((attempt * 3))
            done
            if [[ ! "$status" =~ ^[23] ]]; then
              echo "::error::${target} returned HTTP ${status:-no response}."
              exit 1
            fi
            if [ "$status" = "302" ]; then
              echo "Verified $target (HTTP 302; Cloudflare Access sign-in required)."
            else
              echo "Verified $target (HTTP $status)."
            fi
          done

  comment:
    needs: [check, deploy-app-preview]
    if: always()
    runs-on: ubuntu-latest
    name: Comment Preview URLs
    timeout-minutes: 5
    steps:
      - name: Set short commit SHA
        id: vars
        run: |
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Render preview comment
        timeout-minutes: 3
        env:
          DEPLOY_PREVIEW_RESULT: ${{ needs.deploy-app-preview.result }}
          COMMIT_SHORT_SHA: ${{ steps.vars.outputs.commit_sha }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          pr_url="https://pr${PR_NUMBER}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"
          sha_url="https://${COMMIT_SHORT_SHA}-${WORKER_NAME}.${WORKER_SUBDOMAIN}"

          # Probe every advertised target so the comment never links a dead URL.
          reachable() {
            local url="$1" status=""
            for attempt in 1 2 3; do
              status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)"
              if [[ "$status" =~ ^[23] ]]; then return 0; fi
              sleep $((attempt * 3))
            done
            echo "${status:-no response}"
            return 1
          }

          row() {
            local label="$1" url="$2" status=""
            if ! status="$(reachable "$url")"; then
              printf '| %s | Not available (HTTP %s) |\n' "$label" "$status" >> comment.md
              return
            fi
            printf '| %s | <%s> |\n' "$label" "$url" >> comment.md
          }

          printf '## Deploy preview\n\n| Target | URL |\n| --- | --- |\n' > comment.md
          row "PR #${PR_NUMBER}" "$pr_url"
          row "Commit ${COMMIT_SHORT_SHA}" "$sha_url"

          printf '\n' >> comment.md
          if [ "$DEPLOY_PREVIEW_RESULT" = "success" ]; then
            printf 'All aliases serve the same preview build. App API writes to production D1; preview hostnames are gated by Cloudflare Access. Production R2 is omitted. Inventia read-only access remains configured; Inventia stock writes are disabled.\n' >> comment.md
          else
            printf 'The Deploy App Preview job ended with `%s`; targets may be missing or stale, and rows marked _Not available_ were unreachable when this comment was written.\n' "$DEPLOY_PREVIEW_RESULT" >> comment.md
          fi
          printf 'Preview hostnames sit behind Cloudflare Access, so opening them requires a signed-in browser.\n' >> comment.md

      - name: Create PR comment
        run: |
          for attempt in 1 2 3; do
            if gh pr comment "${{ github.event.number }}" \
              --body-file comment.md --edit-last --create-if-none; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "Failed to post the preview comment after 3 attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
